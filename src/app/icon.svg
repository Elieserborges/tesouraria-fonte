      <stop offset="0%" stop-color="#4A7AFF"/>
      <stop offset="100%" stop-color="#3345ED"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0F1524"/>

  <!-- F desenhado como retângulos: independe de fonte instalada -->
